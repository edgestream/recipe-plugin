server {
    listen 80;
    listen [::]:80;
    server_name srv1 srv1.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srv1 srv1.lan;

    ssl_certificate /etc/nginx/ssl/recipe-plugin/srv1.crt;
    ssl_certificate_key /etc/nginx/ssl/recipe-plugin/srv1.key;

    location = /recipe {
        proxy_pass http://127.0.0.1:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
