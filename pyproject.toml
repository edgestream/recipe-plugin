[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-plugin-server"
version = "0.1.0"
description = "Streamable HTTP MCP server for the Recipe Plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.10,<4", "mcp>=1.28,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
recipe-mcp = "recipe_plugin.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_plugin"]
